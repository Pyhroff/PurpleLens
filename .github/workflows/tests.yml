name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check purplelens/ tests/

      - name: Test
        # SOC_PARALLAX_PATH intentionally unset here — that backend's
        # integration tests skip gracefully without it (see tests/), same
        # as anyone else cloning this repo without a private soc-parallax
        # checkout on disk. Sigma-backend tests always run in full.
        run: pytest tests/ -v
