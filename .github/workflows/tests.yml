name: tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check purplelens/ tests/

      - name: Test
        # SOC_PARALLAX_PATH intentionally unset here — that backend's
        # integration tests skip gracefully without it (see tests/), same
        # as anyone else cloning this repo without a private soc-parallax
        # checkout on disk. Sigma-backend tests always run in full.
        run: pytest tests/ -v
